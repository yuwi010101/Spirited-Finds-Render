<Directory "/var/www/html">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Directory "/var/www/html/config">
    Require all denied
</Directory>

<FilesMatch "(?i)\.(?:sql|sqlite|db|bak|ini|log|txt|md|ya?ml)$">
    Require all denied
</FilesMatch>
<FilesMatch "^(?:Dockerfile|\.dockerignore|\.env(?:\..*)?)$">
    Require all denied
</FilesMatch>
